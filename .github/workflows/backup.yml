name: Weekly backup

# GitHub switches off scheduled workflows after 60 days without repository activity
# and emails the owner; re-enable it from the Actions tab (see docs/runbook.md).
on:
  schedule:
    - cron: "0 16 * * 6" # Saturday 16:00 UTC = early Sunday morning in Sydney
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  backup:
    name: Export and encrypt the production D1
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # This repository is public, so its artifacts can be downloaded by any signed-in
      # GitHub user. The export holds personal data and is never uploaded unencrypted.
      - name: Refuse to run without a passphrase
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "The BACKUP_PASSPHRASE secret is not set. See docs/runbook.md." >&2
            exit 1
          fi
      - name: Export the production D1
        run: |
          npx wrangler d1 export setter-diary --remote --output backup.sql
          test -s backup.sql
      - name: Encrypt the export
        run: |
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase-fd 3 --output backup.sql.gpg backup.sql 3<<<"$BACKUP_PASSPHRASE"
          rm backup.sql
          test -s backup.sql.gpg
      - uses: actions/upload-artifact@v7
        with:
          name: d1-backup-${{ github.run_id }}
          path: backup.sql.gpg
          if-no-files-found: error
          retention-days: 30
