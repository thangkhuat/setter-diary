name: Preview cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  cleanup:
    name: Delete the preview Worker and D1
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Shares its group with the preview job in ci.yml, so the two never run at the same time.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: app-pr-${{ github.event.pull_request.number }}
      DATABASE_NAME: setter-diary-pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The Worker goes first: a D1 cannot be deleted while a Worker is bound to it.
      - name: Delete the preview Worker
        run: |
          if npx wrangler delete "$WORKER_NAME" --force 2>&1 | tee delete.log; then
            exit 0
          fi
          # A PR closed before its first preview deploy has no Worker; anything else is a real failure.
          if grep -q "does not exist on this account" delete.log; then
            echo "No Worker named $WORKER_NAME; nothing to delete."
            exit 0
          fi
          echo "::error::Could not delete Worker $WORKER_NAME."
          exit 1
      - name: Delete the preview D1
        run: |
          id="$(npx wrangler d1 list --json | node scripts/d1-id.mjs "$DATABASE_NAME")"
          if [ -z "$id" ]; then
            echo "No D1 database named $DATABASE_NAME; nothing to delete."
            exit 0
          fi
          npx wrangler d1 delete "$DATABASE_NAME" --skip-confirmation
