<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setter Diary Screens</title>
<style>
/* Governed by: design-system.md (Colors, Typography, Shapes, Components),
   ux-specification.md (Information Architecture, Component Patterns, Hitter Rating, Key Flows 1-2).
   design-system.md and ux-specification.md win on conflict. Light/dark follows the device setting. */
:root{
  --bg:#FFFFFF; --raised:#F2F4F8; --ink:#0B0F1A; --ink2:#5A6272; --border:#D9DDE5;
  --navy:#14213D; --red:#D62839; --on-brand:#FFFFFF;
  --r0:#9AA1AC; --r1:#F5B700; --r2:#4DA3FF; --r3:#2BB673; --on-rating:#0B0F1A;
  --page:#E6E9EF;
  --font:system-ui,-apple-system,Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --raised:#151A24; --ink:#F5F7FA; --ink2:#9AA3B2; --border:#2A3140;
    --navy:#8FA8D9; --red:#FF4D5E; --on-brand:#000000; --page:#0A0C10;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--page);color:var(--ink);padding:24px 16px}
h1{font-size:22px;font-weight:800;margin-bottom:4px}
.intro{color:var(--ink2);font-size:14px;margin-bottom:20px;max-width:760px;line-height:1.45}
.screens{display:flex;flex-wrap:wrap;gap:28px;justify-content:center}
figure{width:340px;max-width:100%}
figcaption{font-size:13px;color:var(--ink2);margin-top:10px;line-height:1.4}
figcaption b{color:var(--ink)}
.phone{position:relative;height:700px;border-radius:40px;border:10px solid #111;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.status{height:28px;font-size:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;padding:0 20px}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 12px}
.top h2{font-size:22px;font-weight:700}
.team{font-size:13px;color:var(--ink2);font-weight:500}
.avatar{width:36px;height:36px;border-radius:9999px;background:var(--navy);color:var(--on-brand);display:grid;place-items:center;font-weight:700;font-size:14px}
.content{flex:1;overflow:hidden;padding:0 16px}
.tabs{display:flex;border-top:1px solid var(--border);height:64px}
.tabs div{flex:1;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink2)}
.tabs .on{color:var(--navy)}
.fab{position:absolute;right:20px;bottom:84px;width:64px;height:64px;border-radius:9999px;background:var(--red);color:var(--on-brand);font-size:36px;font-weight:300;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.3)}
/* session card */
.card{background:var(--raised);border-radius:12px;padding:12px;margin-bottom:12px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.card-h b{font-size:17px}
.meta{font-size:13px;color:var(--ink2);font-weight:500}
.prow{display:grid;grid-template-columns:64px 52px 40px 1fr;align-items:center;gap:8px;min-height:48px;border-top:1px solid var(--border)}
.prow .n{font-weight:700;font-size:16px}
.avg{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.bar{display:flex;height:12px;border-radius:9999px;overflow:hidden}
.bar i{display:block;height:100%}
.c0{background:var(--r0)}.c1{background:var(--r1)}.c2{background:var(--r2)}.c3{background:var(--r3)}
/* sheet */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:20px 20px 0 0;padding:12px 16px 20px}
.grab{width:40px;height:5px;border-radius:9999px;background:var(--border);margin:0 auto 12px}
.sheet h3{font-size:20px;font-weight:700;margin-bottom:4px}
.check{display:flex;align-items:center;gap:12px;min-height:52px;border-bottom:1px solid var(--border);font-size:17px;font-weight:600}
.box{width:28px;height:28px;border-radius:8px;border:2px solid var(--ink2);display:grid;place-items:center;font-size:18px}
.box.on{background:var(--navy);border-color:var(--navy);color:var(--on-brand)}
.pos{margin-left:auto;font-size:13px;color:var(--ink2);font-weight:500}
.primary{margin-top:16px;height:52px;border-radius:12px;background:var(--red);color:var(--on-brand);display:grid;place-items:center;font-weight:700;font-size:17px}
/* logging */
.done{font-weight:700;color:var(--red);font-size:17px}
.ptabs{display:flex;gap:8px;margin-bottom:14px}
.ptab{height:56px;padding:0 16px;border-radius:9999px;border:2px solid var(--border);display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.ptab.on{background:var(--navy);border-color:var(--navy);color:var(--on-brand)}
.ptab small{font-size:13px;opacity:.8}
.lbl{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--ink2);margin:10px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:48px;padding:0 14px;border-radius:9999px;border:2px solid var(--navy);color:var(--navy);display:flex;align-items:center;font-weight:700;font-size:15px}
.chip.on{background:var(--navy);color:var(--on-brand)}
.pass{flex:1;height:56px;border-radius:8px;background:var(--raised);border:3px solid transparent;display:grid;place-items:center;font-weight:700;font-size:16px}
.pass.on{border-color:var(--ink)}
.ratings{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rb{height:76px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--on-rating)}
.rb b{font-size:32px;font-weight:800;line-height:1}
.rb span{font-size:11px;font-weight:700;margin-top:4px}
.entries{margin-top:12px;font-size:14px}
.entry{display:flex;justify-content:space-between;align-items:center;min-height:36px;border-bottom:1px solid var(--border)}
.dot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;color:var(--on-rating);font-size:14px}
.toast{position:absolute;left:16px;right:16px;bottom:80px;background:var(--ink);color:var(--bg);border-radius:12px;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:600}
.toast b{text-decoration:underline}
/* tally + positions */
.posrow{display:flex;gap:6px;padding:0 0 10px 36px;border-bottom:1px solid var(--border)}
.pchip{height:48px;min-width:44px;justify-content:center;padding:0 10px;border-radius:9999px;border:2px solid var(--navy);color:var(--navy);display:flex;align-items:center;font-weight:700;font-size:14px}
.pchip.on{background:var(--navy);color:var(--on-brand)}
.check.sel{border-bottom:none}
.tally{display:grid;grid-template-columns:56px repeat(4,56px);gap:4px;margin-top:6px}
.th{height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:4px;color:var(--on-rating);font-weight:800;font-size:15px}
.rl{display:flex;align-items:center;font-size:13px;font-weight:700;color:var(--navy);line-height:1.15}
.cell{height:56px;border-radius:12px;background:var(--raised);display:grid;place-items:center;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.cell.z{color:var(--ink2);font-size:20px;font-weight:400;opacity:.5}
.lblrow{display:flex;justify-content:space-between;align-items:center}
.fix{height:36px;padding:0 14px;border-radius:9999px;border:2px solid var(--ink2);font-size:13px;font-weight:700;color:var(--ink2);display:flex;align-items:center}
/* hitter */
.torate{background:var(--raised);border-radius:12px;padding:14px;border-left:6px solid var(--red)}
.q{font-size:17px;font-weight:700;margin:6px 0 14px;line-height:1.3}
.rb.sel{outline:4px solid var(--ink);outline-offset:2px}
/* all-screens additions: forms, lists, charts, grids */
.seg{display:flex;background:var(--raised);border-radius:12px;padding:4px;gap:4px}
.seg span{flex:1;height:48px;display:grid;place-items:center;border-radius:8px;font-weight:700;font-size:16px}
.seg .on{background:var(--navy);color:var(--on-brand)}
.flabel{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--ink2);margin:14px 0 6px}
.field{min-height:52px;border:2px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:16px}
.field .ph{color:var(--ink2)}
.field .act{color:var(--navy);font-weight:700;font-size:15px}
.secondary{margin-top:10px;height:52px;border-radius:12px;border:2px solid var(--navy);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:17px}
.textbtn{margin-top:10px;height:48px;display:grid;place-items:center;font-weight:700;color:var(--ink2)}
.row{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--border);font-size:16px}
.row .grow{flex:1;font-weight:600}
.row .sub{display:block;font-size:13px;color:var(--ink2);font-weight:500}
.ini{width:36px;height:36px;border-radius:9999px;background:var(--raised);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:9999px;border:1px solid var(--border);color:var(--ink2)}
.sw{width:48px;height:28px;border-radius:9999px;background:var(--border);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:9999px;background:#FFFFFF}
.sw.on{background:var(--navy)}
.sw.on::after{left:23px}
.swl{font-size:11px;color:var(--ink2);font-weight:700;text-align:center;width:48px}
.sec{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--ink2);margin:14px 0 6px;display:flex;justify-content:space-between;align-items:center}
.sec a{color:var(--navy);text-decoration:none;font-size:13px;letter-spacing:0}
.fchips{display:flex;gap:6px;margin-bottom:6px;overflow:hidden}
.fc{height:48px;padding:0 12px;border-radius:9999px;border:2px solid var(--navy);color:var(--navy);display:flex;align-items:center;font-weight:700;font-size:14px;flex:none}
.fc.on{background:var(--navy);color:var(--on-brand)}
.chart{background:var(--raised);border-radius:12px;padding:8px 6px 4px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:11px;color:var(--ink2);margin:4px 4px 0;font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.pg{display:grid;grid-template-columns:44px repeat(5,48px);gap:3px}
.pg .h{font-size:11px;font-weight:700;color:var(--navy);text-align:center;align-self:end;padding-bottom:2px}
.pg .nm{font-size:14px;font-weight:700;display:flex;align-items:center}
.gc{height:52px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--on-rating)}
.gc b{font-size:17px;font-weight:800;line-height:1.1}
.gc i{font-style:normal;font-size:10px;font-weight:700}
.gc.e{background:var(--raised);color:var(--ink2)}
.since{font-size:13px;color:var(--ink2);font-weight:600;margin:12px 0 6px;display:flex;justify-content:space-between;align-items:center}
.since b{color:var(--navy)}
.back{font-size:17px;color:var(--navy);font-weight:700}
.link{background:var(--raised);border-radius:12px;padding:14px;font-family:ui-monospace,Menlo,monospace;font-size:14px;margin:10px 0;word-break:break-all}
.logo{width:96px;height:96px;border-radius:24px;border:2px dashed var(--ink2);display:grid;place-items:center;color:var(--ink2);font-size:13px;font-weight:700;margin:70px auto 20px}
.center{text-align:center}
.danger{color:var(--red);font-weight:700}
.grp{font-size:18px;font-weight:800;margin:36px auto 14px;max-width:1500px;border-bottom:2px solid var(--border);padding-bottom:6px}
.eg{font-size:13px;color:var(--ink2);font-weight:500;margin-left:auto}
.cnt{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.askai{position:absolute;right:16px;bottom:76px;width:52px;height:52px;border-radius:9999px;background:var(--raised);border:1px solid var(--border);display:grid;place-items:center;font-size:26px;color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.25)}
.msg{max-width:84%;padding:10px 12px;border-radius:12px;font-size:14px;line-height:1.4;margin-bottom:8px}
.msg.ai{background:var(--raised)}
.msg.me{background:var(--navy);color:var(--on-brand);margin-left:auto}
.who{font-size:11px;font-weight:800;color:var(--ink2);margin:2px 0 4px;letter-spacing:.04em}
.inputbar{position:absolute;left:12px;right:12px;bottom:14px;display:flex;gap:8px}
.inputbar .field{flex:1}
.send{width:52px;height:52px;border-radius:12px;background:var(--navy);color:var(--on-brand);display:grid;place-items:center;font-weight:800;font-size:20px}
.chip-r{display:inline-block;min-width:22px;text-align:center;border-radius:6px;font-weight:800;color:var(--on-rating);padding:0 4px}
</style>
</head>
<body>
<h1>Setter Diary screens</h1>
<p class="intro">Every v1 screen, for agreement before build. Content is realistic sample data. Switch your device to dark mode to see the dark theme. The documents (design-system.md, ux-specification.md) win on any conflict with this mock.</p>
<h2 class="grp">Setter</h2>
<div class="screens">
<!-- 1. Sessions -->
<figure>
<div class="phone">
  <div class="status"><span>12:48</span><span>●●● 82%</span></div>
  <div class="top"><div><div class="team">My team ▾</div><h2>Sessions</h2></div><div class="avatar">T</div></div>
  <div class="content">
    <div class="card">

      <div class="prow"><span class="n">Mia</span><span class="meta">14 sets</span><span class="avg">2.4</span><div class="bar"><i class="c0" style="width:7%"></i><i class="c1" style="width:7%"></i><i class="c2" style="width:29%"></i><i class="c3" style="width:57%"></i></div></div>
      <div class="prow"><span class="n">Josh</span><span class="meta">9 sets</span><span class="avg">1.8</span><div class="bar"><i class="c0" style="width:11%"></i><i class="c1" style="width:22%"></i><i class="c2" style="width:44%"></i><i class="c3" style="width:23%"></i></div></div>
      <div class="prow"><span class="n">Leo</span><span class="meta">6 sets</span><span class="avg">2.2</span><div class="bar"><i class="c1" style="width:17%"></i><i class="c2" style="width:50%"></i><i class="c3" style="width:33%"></i></div></div>
    </div>
    <div class="card">
      <div class="card-h"><b>Tue 29 Sep · Practice</b><span class="meta">41 sets</span></div>
      <div class="prow"><span class="n">Mia</span><span class="meta">16 sets</span><span class="avg">2.1</span><div class="bar"><i class="c0" style="width:6%"></i><i class="c1" style="width:19%"></i><i class="c2" style="width:38%"></i><i class="c3" style="width:37%"></i></div></div>
      <div class="prow"><span class="n">Josh</span><span class="meta">13 sets</span><span class="avg">1.5</span><div class="bar"><i class="c0" style="width:15%"></i><i class="c1" style="width:31%"></i><i class="c2" style="width:39%"></i><i class="c3" style="width:15%"></i></div></div>
    </div>
  </div>
  <div class="fab">+</div>
  <div class="tabs"><div class="on">Sessions</div><div>Progress</div><div>Team</div></div>
</div>
<figcaption><b>1 · Sessions.</b> Each session card shows every involved player's logs: set count, average and rating mix. Tap a player row to see their entries; tap the header to add or edit. Red <b>+</b> creates a session.</figcaption>
</figure>
<!-- 2. New session -->
<figure>
<div class="phone">
  <div class="status"><span>12:48</span><span>●●● 82%</span></div>
  <div class="top"><div><div class="team">My team ▾</div><h2>Sessions</h2></div><div class="avatar">T</div></div>
  <div class="content"><div class="card" style="height:160px"></div></div>

    <div class="flabel">NOTES</div>
    <div class="field"><span class="ph">Optional: opponent, drill focus</span></div>
    <div class="primary">Next</div>
  </div>
</div>
<figcaption><b>2 · New session.</b> Pop-up sheet from the red <b>+</b>. Date defaults to today; pick Game or Practice; notes are optional. <b>Next</b> opens Who played?</figcaption>
</figure>
<!-- 2. Who played? -->
<figure>
<div class="phone">
  <div class="status"><span>12:49</span><span>●●● 82%</span></div>
  <div class="top"><div><div class="team">My team ▾</div><h2>Sessions</h2></div><div class="avatar">T</div></div>

<figcaption><b>3 · Who played?</b> Pick the players in this session and, optionally, their position for today: OH outside, S setter, OPP opposite, MB middle, L libero. Positions are pre-filled from last time; Mia moves from outside to opposite today.</figcaption>
</figure>
<!-- 3. Logging (tally) -->
<figure>
<div class="phone">
  <div class="status"><span>12:51</span><span>●●● 81%</span></div>
  <div class="top"><div><div class="team">Sat 3 Oct</div><h2>Game</h2></div><span class="done">Done</span></div>

      <span></span><span class="th c0">0</span><span class="th c1">1</span><span class="th c2">2</span><span class="th c3">3</span>

    </div>

  <div class="toast"><span>Mia · High outside · 3 · +1</span><b>Undo</b></div>
  <div class="tabs" style="visibility:hidden"></div>
</div>
<figcaption><b>4 · Logging (tally).</b> Recall counts, not individual sets: choose the pass, then tap a set type × rating cell once per set. Counts shown are for the selected pass; the tab shows Mia's total. <b>Fix</b> switches taps to remove one.</figcaption>
</figure>
<!-- 5. Entry list -->
<figure>
<div class="phone">
  <div class="status"><span>12:58</span><span>●●● 80%</span></div>
  <div class="top"><div><div class="team">My team ▾</div><h2>Sessions</h2></div><div class="avatar">T</div></div>
  <div class="content"><div class="card" style="height:160px"></div></div>
  <div class="dim"></div>
  <div class="sheet">
    <div class="grab"></div>
    <h3>Mia</h3>
    <p class="meta" style="margin-bottom:6px">Sat 3 Oct · Game · Opposite · 14 sets · average 2.4</p>
    <div class="sec">HIGH OUTSIDE · 7</div>
    <div class="row"><span class="dot c3">3</span><span class="grow">Good pass</span><span class="cnt">×5</span><span class="meta">›</span></div>
